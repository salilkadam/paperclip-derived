name: rel1313-derived-build
on:
  workflow_dispatch:
    inputs:
      upstream_index:
        required: false
        default: "1661b3dd3fdf7a9b59542d1ced464c3faf9dc8309798b4d15a9923ed32795307"
      source_commit:
        required: false
        default: "bba6a45f0d364cfd962ac59b3bdf2426a8222adb"
      push_repo:
        required: false
        default: "salilkadam/paperclip-derived"
      push_tag:
        required: false
        default: "derived-bba6a45f0"
      arches:
        required: false
        default: "amd64 arm64"
jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo apt-get -qq -y --no-install-recommends install postgresql ca-certificates curl > /dev/null
          psql --version; node --version
      - name: Fetch pinned upstream source (bba6a45f, sha256-pinned)
        run: |
          set -euo pipefail
          curl -fsSL "https://codeload.github.com/paperclipai/paperclip/tar.gz/bba6a45f0d364cfd962ac59b3bdf2426a8222adb" -o src.tgz
          echo "58634c70ce9864814bc770eb75bb57c09c3e434168081f060ebb0a47860ac84f  src.tgz" | sha256sum -c -
          mkdir -p repo && tar xzf src.tgz -C repo --strip-components=1
      - name: Install pnpm + deps (no-frozen: upstream lockfile drift)
        working-directory: repo
        run: |
          set -euo pipefail
          sudo rm -f /usr/local/bin/pnpm /usr/local/bin/yarn
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm install --no-frozen-lockfile
      - name: Compile server (server-only: tsc + assets, skip runner-vendor)
        working-directory: repo
        run: |
          set -euo pipefail
          corepack enable
          cd server
          ./node_modules/.bin/tsc
          mkdir -p dist/onboarding-assets dist/built-ins dist/services/scripts
          cp -R src/onboarding-assets/. dist/onboarding-assets/
          cp -R src/built-ins/. dist/built-ins/
          cp -R src/services/scripts/. dist/services/scripts/
          ls dist/index.js && echo TSC-OK
      - name: Apply bionic guard patch (the mandatory derived-layer COPY)
        working-directory: repo
        run: |
          set -euo pipefail
          cp docker-patch/private-hostname-guard.js server/dist/middleware/private-hostname-guard.js
          cp docker-patch/private-hostname-guard.js server/dist/middleware/private-hostname-guard.js
          sha256sum server/dist/middleware/private-hostname-guard.js
      - name: Start postgres 16 + boot server (authenticated/private, NO env stamp)
        run: |
          set -euo pipefail
          PGBIN=$(ls -d /usr/lib/postgresql/*/bin | head -1)
          sudo mkdir -p /var/lib/pgsqlsim && sudo chown postgres /var/lib/pgsqlsim
          sudo -u postgres "$PGBIN/initdb" -D /var/lib/pgsqlsim -U bionic --auth=trust > /dev/null
          sudo -u postgres "$PGBIN/pg_ctl" -D /var/lib/pgsqlsim -o "-p 54331 -c listen_addresses='127.0.0.1'" -l /tmp/pg.log start
          sleep 2
          sudo -u postgres psql -h 127.0.0.1 -p 54331 -U bionic -d postgres -c "CREATE DATABASE bionic_sim;" > /dev/null
          ip addr add 127.0.0.5/32 dev lo 2>/dev/null || true
          cd repo
          setsid nohup env -i PATH=/usr/local/bin:/usr/bin:/bin HOME=/home/runner \
            DATABASE_URL="postgres://bionic@127.0.0.1:54331/bionic_sim" \
            BETTER_AUTH_SECRET=sim-rel1313-secret-0123456789 \
            PAPERCLIP_DEPLOYMENT_MODE=authenticated PAPERCLIP_DEPLOYMENT_EXPOSURE=private \
            PAPERCLIP_BIND=custom PAPERCLIP_BIND_HOST=127.0.0.5 \
            PAPERCLIP_HOME=/home/runner/psim \
            PAPERCLIP_MIGRATION_AUTO_APPLY=true PAPERCLIP_SECRETS_PROVIDER=local \
            node server/dist/index.js > /tmp/boot.log 2>&1 < /dev/null &
          echo $! > /tmp/sim.pid
          for i in $(seq 1 40); do
            kill -0 $(cat /tmp/sim.pid) 2>/dev/null || { echo "server died:"; tail -20 /tmp/boot.log; exit 1; }
            grep -q "listening on http://127.0.0.5" /tmp/boot.log && break
            sleep 5
          done
          grep -o "listening on http://127.0.0.5:[0-9]*" /tmp/boot.log | head -1
          PORT=$(grep -o "listening on http://127.0.0.5:[0-9]*" /tmp/boot.log | head -1 | cut -d: -f3)
          echo "PORT=$PORT" >> "$GITHUB_ENV"
      - name: verify-derived.sh inpod (unmodified acceptance script)
        run: |
          set -euo pipefail
          HEALTH_URL="http://127.0.0.5:${ env.PORT }/api/health" EXPECT_SHA=bba6a45f0d364cfd962ac59b3bdf2426a8222adb \
            bash repo/deploy/docker/verify-derived.sh inpod
          kill $(cat /tmp/sim.pid) 2>/dev/null || true
      - name: Registry pin verification (provenance mode, upstream per-arch)
        run: |
          set -euo pipefail
          bash repo/deploy/docker/verify-derived.sh provenance ghcr.io/paperclipai/paperclip@sha256:bf78a4ad83f4aabf8c673e0c06c4a91f6185aaed28419d423365a535a8a4ee05
          bash repo/deploy/docker/verify-derived.sh provenance ghcr.io/paperclipai/paperclip@sha256:f40c29335cf2ff74dbbdd86ef0a2cb067bbadc1129058eb8c90bb0b6bef13c31
