name: rel1313-derived-build
on:
  workflow_dispatch:
    inputs:
      upstream_index:
        description: 64-hex multi-arch index digest of ghcr.io/paperclipai/paperclip
        required: true
        default: "1661b3dd3fdf7a9b59542d1ced464c3faf9dc8309798b4d15a9923ed32795307"
      source_commit:
        description: 40-hex upstream source SHA (native provenance stamp)
        required: true
        default: "bba6a45f0d364cfd962ac59b3bdf2426a8222adb"
      push_repo:
        description: push destination (owner/name in ghcr)
        required: true
        default: "salilkadam/paperclip-derived"
      push_tag:
        description: tag base (per-arch tags are <tag>-amd64/-arm64; index is <tag>)
        required: true
        default: "derived-bba6a45f0"
      arches:
        required: false
        default: "amd64 arm64"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Build context (no docker)
        run: |
          echo "== inputs: idx=${{ inputs.upstream_index }} src=${{ inputs.source_commit }} push=${{ inputs.push_repo }}:${{ inputs.push_tag }} arches=${{ inputs.arches }}"
          echo "== workflow commit: $(git rev-parse --short HEAD)"
          echo "== overlay guard patch sha256: $(sha256sum docker-patch/private-hostname-guard.js | cut -d' ' -f1)"
          echo "== Dockerfile.derived sha256: $(sha256sum deploy/docker/Dockerfile.derived | cut -d' ' -f1)"
          UPSTREAM_INDEX=${{ inputs.upstream_index }} SOURCE_COMMIT=${{ inputs.source_commit }}           PUSH_REPO=${{ inputs.push_repo }} PUSH_TAG=${{ inputs.push_tag }} ARCHES="${{ inputs.arches }}"           bash -n deploy/docker/build-derived.sh && echo "build-derived.sh syntax OK"
          bash -n deploy/docker/verify-derived.sh && echo "verify-derived.sh syntax OK"
      - name: In-pod acceptance simulation (provenance+guard+overlay, §O)
        run: |
          printf '%s' '' | base64 -d > sim-inpod.sh
          bash sim-inpod.sh
